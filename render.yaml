services:
  - type: web
    name: reachinbox-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false        # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false        # Set manually in Render dashboard
      - key: API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false        # Your Vercel URL, e.g. https://reachinbox.vercel.app
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: MIN_DELAY_MS
        value: "1000"
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: "100"
